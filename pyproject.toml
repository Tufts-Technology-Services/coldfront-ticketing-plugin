[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldfront-ticketing"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name = "Chris Barnett" }
]
description = "Coldfront Ticketing Plugin"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 6.0',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    "coldfront",
    "coldfront_utils@git+https://github.com/Tufts-Technology-Services/coldfront-utils.git",
    "requests>=2.34.2",
]

[project.urls]
"Source Code" = "https://github.com/Tufts-Technology-Services/coldfront-ticketing"

[dependency-groups]
dev = [
    "pytest-django>=4.11.1",
    "factory-boy>=3.3.3",
    "ruff>=0.11.4",
    "responses>=0.26.3",
    "pre-commit>=4.6.2",
]

[tool.hatch.metadata]
# coldfront_utils is only published as a git URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ticketing"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"  # the oldest Python in requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S308", "S113"]

[tool.ruff.lint.isort]
# coldfront's imports get a section of their own, between third-party and this package's
sections = { "coldfront-main" = ["coldfront"] }
section-order = ["future", "standard-library", "third-party", "coldfront-main", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ticketing.tests.settings"
python_files = ["test_*.py"]
