[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldfront-ticketing"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name = "Chris Barnett" }
]
description = "Coldfront Ticketing Plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 6.0',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    "coldfront",
    "coldfront_utils@git+https://github.com/Tufts-Technology-Services/coldfront-utils.git",
]
# No pydantic: the vendored Ticket is a stdlib dataclass. See CLAUDE.md, "Ticket format".

[project.urls]
"Source Code" = "https://github.com/Tufts-Technology-Services/coldfront-ticketing"

[dependency-groups]
dev = [
    "pytest-django>=4.11.1",
    "factory-boy>=3.3.3",
    "ruff>=0.11.4",
]

[tool.hatch.metadata]
# coldfront_utils is only published as a git URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ticketing"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
# docs/reference holds verbatim upstream copies; reformatting them would defeat the point.
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ticketing.tests.settings"
python_files = ["test_*.py"]
